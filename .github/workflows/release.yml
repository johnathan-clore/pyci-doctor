# Creates a GitHub release whenever a version tag (v1.2.3) is pushed:
#   git tag -a v1.2.3 -m "pyci-doctor 1.2.3"
#   git push origin v1.2.3
# and, once switched on, publishes the same files to PyPI (see "Publishing to PyPI" in the README).
# Hand-written (not generated by pyci-doctor), because it needs write access.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read # each job asks for exactly the extra access it needs

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creating a release writes to the repository
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install package and test tools
        run: python -m pip install -e ".[dev]" build

      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import pyci_doctor; print(pyci_doctor.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ $version in src/pyci_doctor/__init__.py"
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Build the package
        run: python -m build

      - name: Keep the built files for the PyPI job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  pypi:
    # Off until the repository variable PUBLISH_TO_PYPI is set to "true",
    # so releases keep working before PyPI is set up.
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing: PyPI checks this workflow's identity; no password is stored
    steps:
      - name: Get the built files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
