# Weekly check that nothing pyci-doctor generates has gone stale:
# GitHub action versions, the newest Python, and the pinned ruff version.
# A red run here means: update the named constant, regenerate, and release.
# Hand-written (not generated by pyci-doctor).
name: Maintenance

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"

      - name: Check for newer actions, Python and ruff
        run: python -m pytest -m network -v
