# Generated by pyci-doctor. To regenerate: pyci-doctor init --force --flaky-runs 5
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.15"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      # >>> custom steps (test): pyci-doctor keeps anything between these lines
      # <<< custom steps (test)

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install ruff
        run: python -m pip install ruff==0.17.5

      - name: Lint
        run: python -m ruff check .

      # >>> custom steps (lint): pyci-doctor keeps anything between these lines
      # <<< custom steps (lint)

  flaky:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"

      - name: Install pyci-doctor
        run: python -c "import pyci_doctor" || python -m pip install "git+https://github.com/johnathan-clore/pyci-doctor@v0.3.0"

      - name: Run tests 5 times and report flaky tests
        run: python -m pyci_doctor flaky --runs 5

      - name: Keep the results for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-results
          path: flaky-results/

      # >>> custom steps (flaky): pyci-doctor keeps anything between these lines
      # <<< custom steps (flaky)

  # >>> custom jobs: pyci-doctor keeps anything between these lines
  # <<< custom jobs
