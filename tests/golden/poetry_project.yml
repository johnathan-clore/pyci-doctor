# Generated by pyci-doctor. To regenerate: pyci-doctor init --force
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.15"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install package and test tools
        run: python -m pip install poetry && poetry install --all-extras

      - name: Run tests
        run: poetry run pytest -v

      # >>> custom steps (test): pyci-doctor keeps anything between these lines
      # <<< custom steps (test)

  # >>> custom jobs: pyci-doctor keeps anything between these lines
  # <<< custom jobs
