[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyci-doctor"
dynamic = ["version"]
description = "Generate cross-platform GitHub Actions CI for Python projects and detect flaky tests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johnathan Clore" }]
keywords = ["ci", "github-actions", "testing", "flaky-tests", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/johnathan-clore/pyci-doctor"
Issues = "https://github.com/johnathan-clore/pyci-doctor/issues"
Releases = "https://github.com/johnathan-clore/pyci-doctor/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
ai = ["pyyaml>=6"]

[project.scripts]
pyci-doctor = "pyci_doctor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pyci_doctor.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"
# The fake projects are test data, not our code; one is a deliberately broken pyproject.toml
# that ruff would otherwise try to read as configuration and fail on.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Pyflakes, pycodestyle, bugbear (likely bugs), pyupgrade (modern syntax), simplify.
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*", "build", "dist", "*.egg-info"]
addopts = "-ra --strict-markers"
